
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>81EXS</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f5f7fb;color:#182338;
 font-family:Arial,sans-serif;
}
header{
 height:65px;background:#fff;
 display:flex;align-items:center;
 padding:0 20px;gap:12px;
 box-shadow:0 2px 8px #0001;
}
.logo{
 width:38px;height:38px;border-radius:50%;
 background:#1677ee;color:white;
 display:grid;place-items:center;font-size:23px;
}
.brand{font-size:23px;font-weight:bold}
main{
 max-width:430px;margin:55px auto;
 padding:25px;
}
h2{text-align:center;font-size:27px}
.subtitle{text-align:center;color:#8290a5}
.tabs{display:flex;margin:30px 0 20px}
.tab{
 flex:1;padding:13px;border:0;
 background:#e9eef6;font-size:16px;
}
.tab.active{background:#1677ee;color:white}
input{
 width:100%;padding:16px;margin:9px 0;
 border:1px solid #dce3ed;border-radius:7px;
 font-size:16px;
}
button.submit{
 width:100%;padding:16px;margin-top:18px;
 background:#1677ee;color:white;
 border:0;border-radius:7px;
 font-size:16px;font-weight:bold;
}
footer{text-align:center;color:#929eb0;font-size:12px}
</style>
</head>
<body>
<header>
 <div class="logo">✉</div>
 <div class="brand">81EXS</div>
</header>
<main>
 <h2>Bienvenido a 81EXS</h2>
 <p class="subtitle">Accede a tu cuenta o crea una nueva</p>

 <div class="tabs">
  <button class="tab active" id="loginTab" onclick="show('login')">Iniciar sesión</button>
  <button class="tab" id="registerTab" onclick="show('register')">Registrarse</button>
 </div>

 <section id="login">
  <input placeholder="Nombre de usuario" autocomplete="username">
  <input type="password" placeholder="Contraseña" autocomplete="current-password">
  <button class="submit" onclick="alert('La autenticación segura se configurará en el siguiente paso.')">INICIAR SESIÓN</button>
 </section>

 <section id="register" hidden>
  <input placeholder="Crear nombre de usuario" autocomplete="username">
  <input type="password" placeholder="Crear contraseña" autocomplete="new-password">
  <button class="submit" onclick="alert('El registro seguro se configurará en el siguiente paso.')">CREAR CUENTA</button>
 </section>
</main>
<footer>81EXS · Plataforma independiente</footer>
<script>
function show(page){
 document.getElementById('login').hidden=page!=='login';
 document.getElementById('register').hidden=page!=='register';
 document.getElementById('loginTab').classList.toggle('active',page==='login');
 document.getElementById('registerTab').classList.toggle('active',page==='register');
}
</script>
</body>
</html>
